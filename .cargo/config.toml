# musl targets build fully static binaries (SPEC §3.4). crt-static is pinned
# PER TARGET (not a global default target): forcing one target in [build]
# would break native builds on macOS/Windows hosts, and a global RUSTFLAGS
# crt-static is invalid on non-musl targets.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
