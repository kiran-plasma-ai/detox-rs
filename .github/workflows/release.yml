# Release build matrix (SPEC §3.4). DRAFT: written but not yet exercised by
# a real tag push — expect first-run friction (toolchain names, aarch64
# cross). x86_64-musl is the fully-proven path locally.
name: release

on:
  push:
    tags: ["v*"]
  # lets the draft matrix be tested from a branch without a tag
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      # SPEC §3.4: assert static before packaging, same as dist/build.sh
      - run: file target/x86_64-unknown-linux-musl/release/detox-rs | grep -q 'static'
      - run: |
          cd target/x86_64-unknown-linux-musl/release
          tar -czf detox-rs-x86_64-unknown-linux-musl.tar.gz detox-rs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/detox-rs-*.tar.gz

  # aarch64 musl needs a cross linker; `cross` uses docker on the runner.
  linux-aarch64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cross --locked
      - run: cross build --release --target aarch64-unknown-linux-musl
      # cross runs the container as root on some runners; normalize ownership
      # so the packaging steps can read the artifacts (first-run friction).
      - run: sudo chown -R "$USER" target || true
      - run: file target/aarch64-unknown-linux-musl/release/detox-rs | grep -q 'static'
      - run: |
          cd target/aarch64-unknown-linux-musl/release
          tar -czf detox-rs-aarch64-unknown-linux-musl.tar.gz detox-rs
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: target/aarch64-unknown-linux-musl/release/detox-rs-*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - run: |
          lipo -create \
            target/x86_64-apple-darwin/release/detox-rs \
            target/aarch64-apple-darwin/release/detox-rs \
            -output detox-rs-universal2-apple-darwin
          lipo -info detox-rs-universal2-apple-darwin
          tar -czf detox-rs-universal2-apple-darwin.tar.gz detox-rs-universal2-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: detox-rs-universal2-apple-darwin.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
      - shell: pwsh
        run: Compress-Archive target/release/detox-rs.exe detox-rs-x86_64-pc-windows-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: detox-rs-x86_64-pc-windows-msvc.zip

  # One global checksum file beats per-job ones that silently diverge in
  # format (sha256sum vs Get-FileHash).
  release:
    needs: [linux, linux-aarch64, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-out
      - run: cd dist-out && sha256sum * > SHA256SUMS
      # A workflow_dispatch run is a matrix test: publish as DRAFT, never
      # a real release (review finding 3).
      - uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            dist-out/*
            dist-out/SHA256SUMS
